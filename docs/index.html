<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="GeoFS Copilot">
<meta property="og:description" content="Free extension for the GeoFS flight simulator: leaderboard, events, daily challenge, landing contest, airlines and more.">

<title>GeoFS Copilot – leaderboard, pilots & install</title>
<meta name="description" content="GeoFS Copilot: a free plugin for the GeoFS flight simulator with automatic takeoff, navigation by city name, missions, fuel, ATC and an online pilot leaderboard.">
<style>
  :root{--bg:#070b12;--panel:#0f1724;--panel2:#141f31;--line:#22314a;--text:#e8eef7;--muted:#8a9ab3;--accent:#e040fb;--gold:#ffd54f;--green:#4cff8f;--cyan:#4dd0e1}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#1b1035 0%,transparent 60%),radial-gradient(900px 500px at 0% 0%,#0b2236 0%,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
  a{color:var(--cyan);text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px}
  header{display:flex;align-items:center;gap:14px;padding:18px 0}
  .logo{font-weight:800;font-size:20px;letter-spacing:.2px;color:var(--text)}
  .logo span{color:var(--accent)}
  nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  nav a{color:var(--muted);padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px}
  nav a.on,nav a:hover{color:var(--text);background:var(--panel2);text-decoration:none}
  .lang{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 9px;cursor:pointer;font-weight:700}
  .hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding:38px 0 26px}
  .hero h1{font-size:42px;line-height:1.08;margin:0 0 12px;letter-spacing:-.5px}
  .hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:#b9c6da;font-size:17px;margin:0 0 20px}
  .hero .promo{width:100%;height:auto;max-width:460px;justify-self:center;border-radius:18px;border:1px solid var(--line);box-shadow:0 18px 60px rgba(0,120,255,.25),0 0 0 1px rgba(64,196,255,.15)}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:700;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
  .btn.pri{background:linear-gradient(135deg,#8e24aa,#c51162);border-color:#d05ce3}
  .btn.drag{cursor:grab;border-style:dashed;border-color:var(--accent)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat b{display:block;font-size:26px;letter-spacing:-.5px}
  .stat span{color:var(--muted);font-size:13px}
  section{padding:18px 0 30px}
  h2{font-size:24px;margin:0 0 14px;letter-spacing:-.2px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tabs button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 13px;font-weight:600;cursor:pointer}
  .tabs button.on{color:#fff;border-color:var(--accent);background:#2a1236}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;background:var(--panel2)}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#121c2c}
  td.num{text-align:right;font-variant-numeric:tabular-nums} th.num{text-align:right}
  .pos{font-weight:800;color:var(--muted);width:44px}
  .p1 .pos{color:var(--gold)} .p2 .pos{color:#cfd8dc} .p3 .pos{color:#ffab91}
  .rank{display:inline-block;font-size:12px;color:#d59ce6;background:#24112f;border:1px solid #4a2161;border-radius:12px;padding:1px 8px;margin-left:6px}
  .muted{color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid2>div{min-width:0}
  .feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .feat div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .feat b{display:block;margin:6px 0 4px;font-size:16px}
  .feat p{margin:0;color:#aab7cb;font-size:14px}
  .steps{counter-reset:s;list-style:none;padding:0;margin:0}
  .steps li{counter-increment:s;padding:10px 0 10px 44px;position:relative;border-bottom:1px solid var(--line)}
  .steps li:before{content:counter(s);position:absolute;left:0;top:9px;width:30px;height:30px;border-radius:50%;background:#2a1236;border:1px solid var(--accent);display:grid;place-items:center;font-weight:800}
  code{background:#0b1220;border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:13px;word-break:break-all}
  .ach{display:flex;flex-wrap:wrap;gap:6px}
  .ach span{background:#2a2005;border:1px solid #8d6e00;border-radius:16px;padding:3px 10px;font-size:13px}
  .empty{padding:26px;text-align:center;color:var(--muted)}
  .profile-head{display:flex;gap:16px;align-items:center;margin-bottom:14px}
  .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#8e24aa,#0277bd);display:grid;place-items:center;font-size:28px}
  footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:13px}
  .scroll{overflow-x:auto}
  @media (max-width:820px){.hero{grid-template-columns:1fr}.hero h1{font-size:32px}.feat,.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hide-m{display:none}}
  .online{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;color:#b9f6ca;font-size:13px;text-decoration:none;white-space:nowrap;margin-left:8px}
  .online i{width:9px;height:9px;border-radius:50%;background:#2bd96b;box-shadow:0 0 0 0 rgba(43,217,107,.7);animation:pulse 1.8s infinite}
  .online.zero i{background:#5c6b80;animation:none}
  .online.zero{color:var(--muted)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(43,217,107,.7)}70%{box-shadow:0 0 0 9px rgba(43,217,107,0)}100%{box-shadow:0 0 0 0 rgba(43,217,107,0)}}
  .onlist{margin-top:14px;font-size:14px;color:#b9c6da}
  .onlist a{color:#b9f6ca}
</style>
</head>

async function drawPassportMap(v) {
  const pts = v.filter((x) => x.lat != null && x.lon != null); if (!pts.length) return;
  try {
    await loadLeaflet(); const el = document.getElementById('pmap'); if (!el) return;
    const m = L.map(el, {worldCopyJump: true, scrollWheelZoom: false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 12, attribution: '© OpenStreetMap'}).addTo(m);
    const g = L.featureGroup(pts.map((x) => L.circleMarker([+x.lat, +x.lon], {radius: 5 + Math.min(6, x.n), color: '#e040fb', fillOpacity: .7}).bindTooltip(`${x.icao} ${flag(x.country)} · ${x.n}×`))).addTo(m);
    m.fitBounds(g.getBounds().pad(0.3), {maxZoom: 7});
  } catch (e) { /* hartă indisponibilă */ }
}

function evCard(e) {

  const when = new Date(st).toLocaleString(lang === 'ro' ? 'ro-RO' : 'en-GB', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
  return `<a href="#/event/${e.id}" class="card" style="display:block;padding:14px 16px;margin-bottom:10px;text-decoration:none;color:inherit;${live ? 'border-color:#ff5252' : ''}">
    <div class="muted" style="font-size:13px">${live ? `<b style="color:#ff5252">🔴 ${t('live')}</b> · ` : ''}${esc(when)}</div>
    <div style="font-size:19px;font-weight:800;margin:2px 0">${esc(e.title)}</div>
    <div>${e.dep || e.arr ? `${esc(e.dep || '…')} → ${esc(e.arr || '…')}` : t('freeRoute')}${e.aircraft ? ` · ✈ ${esc(e.aircraft)}` : ''}${reward ? ` · <b>${reward}</b>` : ''} · 👥 ${fmt(e.going)} ${t('going')} · ✓ ${fmt(e.finished)} ${t('finishedN')}</div></a>`;
}

  ${step(2, ro ? 'Primești memento' : 'Get reminded', ro ? 'Dacă ești înscris și ai GeoFS deschis, primești un mesaj cu <b>15 minute înainte</b> și altul <b>când începe</b> evenimentul.' : 'If you have joined and GeoFS is open, you get a message <b>15 minutes before</b> and another one <b>when the event starts</b>.')}
  ${step(3, ro ? 'Mergi la plecare' : 'Go to the departure', ro ? 'Butonul <b>🛫 Mergi la plecare</b> te mută pe pista aeroportului de plecare, cu traseul spre destinație gata setat. <b>🧭 Traseu</b> setează doar destinația, dacă vrei să ajungi singur la plecare.' : 'The <b>🛫 Go to departure</b> button moves you onto the runway at the departure airport, with the route to the destination already set. <b>🧭 Route</b> only sets the destination, if you want to get to the departure yourself.')}

  </ul>
  <h3 style="margin:18px 0 8px">${ro ? 'Întrebări frecvente' : 'FAQ'}</h3>

  ${qa(ro ? 'Trebuie să mă înscriu ca să particip?' : 'Do I have to join to take part?', ro ? 'Nu. Orice zbor care respectă ruta și fereastra de timp contează automat. Înscrierea îți aduce memento-urile și te arată în lista participanților.' : 'No. Any flight that matches the route and the time window counts automatically. Joining gets you the reminders and puts you on the list of participants.')}

  </section>`;
}

function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('on', a.dataset.r === (parts[0] === 'pilot' ? 'leaderboard' : parts[0])));
  window.scrollTo(0, 0);
  if (parts[0] === 'leaderboard') return leaderboard(parts[1]);
  if (parts[0] === 'flights') return flights();
  if (parts[0] === 'daily') return daily();
  if (parts[0] === 'events') return events();
  if (parts[0] === 'event') return eventPage(parts[1]);
  if (parts[0] === 'contest') return contest(parts[1]);
  if (parts[0] === 'airlines') return airlines();
  if (parts[0] === 'install') return install();
  if (parts[0] === 'pilot' && parts[1]) return pilot(parts[1]);
  return home();
}
