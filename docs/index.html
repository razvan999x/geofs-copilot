<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeoFS Copilot – leaderboard, pilots & install</title>
<meta name="description" content="GeoFS Copilot: a free plugin for the GeoFS flight simulator with automatic takeoff, navigation by city name, missions, fuel, ATC and an online pilot leaderboard.">
<style>
  :root{--bg:#070b12;--panel:#0f1724;--panel2:#141f31;--line:#22314a;--text:#e8eef7;--muted:#8a9ab3;--accent:#e040fb;--gold:#ffd54f;--green:#4cff8f;--cyan:#4dd0e1}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#1b1035 0%,transparent 60%),radial-gradient(900px 500px at 0% 0%,#0b2236 0%,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
  a{color:var(--cyan);text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px}
  header{display:flex;align-items:center;gap:14px;padding:18px 0}
  .logo{font-weight:800;font-size:20px;letter-spacing:.2px;color:var(--text)}
  .logo span{color:var(--accent)}
  nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
  nav a{color:var(--muted);padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px}
  nav a.on,nav a:hover{color:var(--text);background:var(--panel2);text-decoration:none}
  .lang{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 9px;cursor:pointer;font-weight:700}
  .hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding:38px 0 26px}
  .hero h1{font-size:42px;line-height:1.08;margin:0 0 12px;letter-spacing:-.5px}
  .hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--accent),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:#b9c6da;font-size:17px;margin:0 0 20px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:10px;font-weight:700;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
  .btn.pri{background:linear-gradient(135deg,#8e24aa,#c51162);border-color:#d05ce3}
  .btn.drag{cursor:grab;border-style:dashed;border-color:var(--accent)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat b{display:block;font-size:26px;letter-spacing:-.5px}
  .stat span{color:var(--muted);font-size:13px}
  section{padding:18px 0 30px}
  h2{font-size:24px;margin:0 0 14px;letter-spacing:-.2px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tabs button{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 13px;font-weight:600;cursor:pointer}
  .tabs button.on{color:#fff;border-color:var(--accent);background:#2a1236}
  table{width:100%;border-collapse:collapse}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;background:var(--panel2)}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#121c2c}
  td.num{text-align:right;font-variant-numeric:tabular-nums} th.num{text-align:right}
  .pos{font-weight:800;color:var(--muted);width:44px}
  .p1 .pos{color:var(--gold)} .p2 .pos{color:#cfd8dc} .p3 .pos{color:#ffab91}
  .rank{display:inline-block;font-size:12px;color:#d59ce6;background:#24112f;border:1px solid #4a2161;border-radius:12px;padding:1px 8px;margin-left:6px}
  .muted{color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid2>div{min-width:0}
  .feat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .feat div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .feat b{display:block;margin:6px 0 4px;font-size:16px}
  .feat p{margin:0;color:#aab7cb;font-size:14px}
  .steps{counter-reset:s;list-style:none;padding:0;margin:0}
  .steps li{counter-increment:s;padding:10px 0 10px 44px;position:relative;border-bottom:1px solid var(--line)}
  .steps li:before{content:counter(s);position:absolute;left:0;top:9px;width:30px;height:30px;border-radius:50%;background:#2a1236;border:1px solid var(--accent);display:grid;place-items:center;font-weight:800}
  code{background:#0b1220;border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:13px;word-break:break-all}
  .ach{display:flex;flex-wrap:wrap;gap:6px}
  .ach span{background:#2a2005;border:1px solid #8d6e00;border-radius:16px;padding:3px 10px;font-size:13px}
  .empty{padding:26px;text-align:center;color:var(--muted)}
  .profile-head{display:flex;gap:16px;align-items:center;margin-bottom:14px}
  .avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#8e24aa,#0277bd);display:grid;place-items:center;font-size:28px}
  footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:13px}
  .scroll{overflow-x:auto}
  @media (max-width:820px){.hero{grid-template-columns:1fr}.hero h1{font-size:32px}.feat,.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hide-m{display:none}}
</style>
</head>
<body>

  streak7:['🔥','One week straight','O săptămână la rând'],streak30:['☄️','Unstoppable','De neoprit'],daily:['🏆','Challenge accepted','Provocare acceptată'],daily_top3:['🥇','On the podium','Pe podium'],
  contest_podium:['🏅','Landing contest podium','Podium la concursul de aterizare'],airline:['🏢','CEO','Director general'],fleet5:['🛫','Fleet','Flotă'],bush_pilot:['🛩️','Bush pilot','Pilot bush'],
  tour_guide:['📸','Tour guide','Ghid turistic'],skydive:['🪂','Jump pilot','Lansare reușită'],surveyor:['🗺️','Surveyor','Cartograf'],sar_hero:['🛟','Rescuer','Salvator']};

const flag = (c) => c && /^[A-Z]{2}$/.test(c) ? String.fromCodePoint(...[...c].map((x) => 127397 + x.charCodeAt(0))) : '🏳️';
const cname = (c) => { try { return new Intl.DisplayNames([lang], {type:'region'}).of(c); } catch (e) { return c; } };

const T = {
  nav_lb:['Leaderboard','Clasament'], nav_daily:['Daily','Provocarea zilei'], nav_contest:['Contest','Concurs'], nav_air:['Airlines','Companii'],
  daily:['Daily challenge','Provocarea zilei'], dailyLead:['One airport for everyone, every day. Land there and post the best score – you can retry as many times as you like until midnight UTC.','Un aeroport pentru toți, în fiecare zi. Aterizează acolo și obține cel mai bun scor – poți reîncerca de câte ori vrei până la miezul nopții UTC.'],

  tomorrow:['Tomorrow','Mâine'], players:['pilots','piloți'], attempts:['tries','încercări'], noDaily:['Nobody has landed yet today – be the first!','Nimeni n-a aterizat încă azi – fii primul!'],
  contest:['Weekly landing contest','Concursul săptămânal de aterizare'], contestLead:['Every pilot\'s best landing of the week (Monday–Sunday, UTC). Runway must be identified. Top 3 get the Podium badge.','Cea mai bună aterizare a fiecărui pilot din săptămână (luni–duminică, UTC). Pista trebuie identificată. Primii 3 primesc insigna Podium.'],
  thisWeek:['This week','Săptămâna asta'], lastWeek:['Last week','Săptămâna trecută'], noContest:['No landings this week yet.','Nicio aterizare săptămâna asta.'],
  airlines:['Virtual airlines','Companii aeriene virtuale'], airLead:['Airlines founded by pilots in the plugin (Airline tab). Their fleets earn money on routes the founder flew first.','Companii înființate de piloți în plugin (tab-ul Companie). Flotele lor câștigă bani pe rutele zburate întâi de fondator.'],

  passport:['Passport','Pașaport'], countries:['countries','țări'], airportsW:['airports','aeroporturi'], streak:['Day streak','Serie de zile'], bestStreak:['best','record'], dailies:['Daily challenges','Provocări zilnice'],

};
const t = (k) => (T[k] ? T[k][lang === 'ro' ? 1 : 0] : k);
const rankOf = (xp) => { let r = RANKS[0]; RANKS.forEach((x) => { if (xp >= x[0]) r = x; }); return lang === 'ro' ? r[2] : r[1]; };
const esc = (s) => String(s == null ? '' : s).replace(/[<>&"']/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));

async function rpc(fn, body) { const r = await fetch(API + fn, {method:'POST', headers:{apikey:KEY,'Content-Type':'application/json'}, body: JSON.stringify(body||{})}); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }

function i18nStatic() { document.querySelectorAll('[data-i]').forEach((e) => { e.textContent = t(e.dataset.i); }); document.getElementById('lang').textContent = lang === 'ro' ? 'EN' : 'RO'; document.documentElement.lang = lang; }
document.getElementById('lang').onclick = () => { lang = lang === 'ro' ? 'en' : 'ro'; localStorage.setItem('gcLang', lang); i18nStatic(); route(); };

function pilotTable(rows, sort) {
  if (!rows.length) return `<div class="empty">${t('empty')}</div>`;
  const ex = {countries:[t('explorers'),(p)=>fmt(p.countries)+' · '+fmt(p.airports)+' ✈'],airports:[t('airportsW'),(p)=>fmt(p.airports)],streak:[t('streaks'),(p)=>'🔥 '+fmt(p.best_streak)+(p.streak?` <span class="muted">(${fmt(p.streak)})</span>`:'')]}[sort];
  return `<div class="scroll"><table><thead><tr><th>#</th><th>${t('pilot')}</th>${ex?`<th class="num">${ex[0]}</th>`:''}<th class="num">XP</th><th class="num">${t('flights')}</th><th class="num hide-m">${t('hours')}</th><th class="num hide-m">${t('missions')}</th><th class="num">${t('earned')}</th><th class="num hide-m">${t('best')}</th></tr></thead><tbody>` +
    rows.map((p) => `<tr class="p${p.pos}"><td class="pos">${p.pos}</td><td><a href="#/pilot/${p.id}"><b>${esc(p.callsign)}</b></a><span class="rank">${rankOf(p.xp)}</span>${p.streak>=2?` <span title="${t('streak')}">🔥${p.streak}</span>`:''}</td>${ex?`<td class="num"><b>${ex[1](p)}</b></td>`:''}<td class="num">${fmt(p.xp)}</td><td class="num">${fmt(p.flights)}</td><td class="num hide-m">${fmt(p.hours,1)}</td><td class="num hide-m">${fmt(p.missions)}</td><td class="num">$${fmt(p.earned)}</td><td class="num hide-m">${p.best_landing_fpm != null ? fmt(p.best_landing_fpm) + ' fpm' : '—'}</td></tr>`).join('') + '</tbody></table></div>';
}
function flightTable(rows, best) {
  if (!rows.length) return `<div class="empty">${t('emptyF')}</div>`;
  return `<div class="scroll"><table><thead><tr><th>${t('pilot')}</th><th>${t('route')}</th><th class="hide-m">${t('aircraft')}</th><th class="num">${t('landing')}</th><th class="num">${t('score')}</th><th class="num hide-m">${t('when')}</th></tr></thead><tbody>` +
    rows.map((f) => `<tr><td><a href="#/pilot/${f.pilot_id}">${esc(f.callsign)}</a></td><td>${esc(f.dep || '?')} → ${esc(f.arr || '?')} ${f.mission_type ? (MT[f.mission_type] || '') : ''}${f.emergency ? ' ⚠️' : ''} <span class="muted">${fmt(f.dist_nm)} NM</span></td><td class="hide-m muted">${esc(f.aircraft || '')}</td><td class="num">${f.landing_vs != null ? fmt(f.landing_vs) + ' fpm' : '—'}</td><td class="num">${f.landing_score != null ? '<b>' + f.landing_score + '</b>' : '—'}</td><td class="num hide-m muted">${ago(f.created_at)}</td></tr>`).join('') + '</tbody></table></div>';
}

async function home() {
  app.innerHTML = `<div class="hero"><div><h1>${t('h1')}</h1><p>${t('lead')}</p>
    <a class="btn pri" href="#/install">✈ ${t('install')}</a> <a class="btn" href="#/leaderboard">🏆 ${t('seeLb')}</a></div>

      <div><h2>🧈 ${t('contest')} <a class="muted" style="font-size:14px" href="#/contest">→</a></h2><div class="card" id="hcontest"><div class="empty">${t('loading')}</div></div></div></section>

  try { const s = await rpc('get_stats'); document.getElementById('stats').innerHTML = [[s.pilots,t('pilots')],[s.flights,t('flights')],[s.hours,t('hours')],[s.nm,t('nm')],s.countries ? [s.countries,t('countries')] : [s.airports,t('airportsW')],[s.flights_24h,t('f24')]].map(([v,l]) => `<div class="stat"><b>${fmt(v)}</b><span>${l}</span></div>`).join(''); } catch (e) { document.getElementById('stats').innerHTML = ''; }
  rpc('get_leaderboard', {p_sort:'xp', p_limit:10}).then((r) => { document.getElementById('top').innerHTML = pilotTable(r); }).catch(() => {});
  rpc('get_daily', {p_limit:5}).then((d) => { document.getElementById('hdaily').innerHTML = dailyHead(d) + scoreTable(d.board, 'daily'); }).catch(() => {});
  rpc('get_landing_contest', {p_limit:5}).then((c) => { document.getElementById('hcontest').innerHTML = scoreTable(c.board, 'contest'); }).catch(() => {});
  rpc('get_recent_flights', {p_limit:8, p_best:true}).then((r) => { document.getElementById('best').innerHTML = flightTable(r, true); }).catch(() => {});
  rpc('get_recent_flights', {p_limit:8, p_best:false}).then((r) => { document.getElementById('recent').innerHTML = flightTable(r); }).catch(() => {});
}
function features() {

async function pilot(id) {

      <span class="rank" style="margin:0">${rankOf(p.xp)}</span> <span class="muted">· ${t('position')} #${d.rank_pos} · ${esc(p.last_aircraft || '')}</span></div></div>
      <div class="stats" style="margin-bottom:16px">${[[fmt(p.xp),'XP'],[fmt(p.flights),t('flights')],[fmt(p.hours,1),t('hours')],[fmt(p.missions),t('missions')],['$'+fmt(p.earned),t('earned')],[p.best_landing_fpm!=null?fmt(p.best_landing_fpm)+' fpm':'—',t('best')]].map(([v,l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>

function passportHtml(d) {
  const p = d.pilot, v = d.visits || [], a = d.airline, dl = d.dailies || [];
  const byC = {}; v.forEach((x) => { if (x.country) byC[x.country] = (byC[x.country] || 0) + 1; });
  const cs = Object.keys(byC).sort((x, y) => byC[y] - byC[x]);
  return `<div class="grid2" style="margin-bottom:16px"><div class="card" style="padding:14px 16px"><h3 style="margin:0 0 6px">🛂 ${t('passport')}</h3>
      <div><b style="font-size:22px">${fmt(cs.length)}</b> ${t('countries')} · <b style="font-size:22px">${fmt(v.length)}</b> ${t('airportsW')}</div>
      <div style="font-size:22px;line-height:1.5;margin-top:6px">${cs.map((c) => `<span title="${esc(cname(c))}: ${byC[c]}">${flag(c)}</span>`).join(' ') || '<span class="muted" style="font-size:14px">—</span>'}</div>
      <div class="muted" style="font-size:12px;margin-top:6px">${v.map((x) => esc(x.icao)).join(' · ')}</div>
      <div id="pmap" style="height:260px;border-radius:10px;margin-top:10px;${v.some((x) => x.lat != null) ? '' : 'display:none'}"></div></div>
    <div class="card" style="padding:14px 16px"><h3 style="margin:0 0 6px">🔥 ${t('streak')}: ${fmt(p.streak || 0)} <span class="muted" style="font-size:14px">· ${t('bestStreak')} ${fmt(p.best_streak || 0)}</span></h3>
      ${a ? `<h3 style="margin:12px 0 4px">🏢 ${esc(a.name)} <span class="muted">${esc(a.code)}</span></h3><div class="muted">${t('hub')} ${esc(a.hub)} · ${fmt(a.fleet)} ✈ · ${fmt(a.routes)} ${t('routes').toLowerCase()} · ${t('rep')} ${fmt(a.rep)} · $${fmt(a.value)}</div>` : ''}
      ${dl.length ? `<h3 style="margin:12px 0 4px">🏆 ${t('dailies')}</h3><div class="muted">${dl.map((x) => `${esc(x.day.slice(5))} ${esc(x.icao)} <b style="color:var(--fg)">${x.score}</b>`).join(' · ')}</div>` : ''}</div></div>`;
}
async function drawPassportMap(v) {
  const pts = v.filter((x) => x.lat != null && x.lon != null); if (!pts.length) return;
  try {
    await loadLeaflet(); const el = document.getElementById('pmap'); if (!el) return;
    const m = L.map(el, {worldCopyJump: true, scrollWheelZoom: false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 12, attribution: '© OpenStreetMap'}).addTo(m);
    const g = L.featureGroup(pts.map((x) => L.circleMarker([+x.lat, +x.lon], {radius: 5 + Math.min(6, x.n), color: '#e040fb', fillOpacity: .7}).bindTooltip(`${x.icao} ${flag(x.country)} · ${x.n}×`))).addTo(m);
    m.fitBounds(g.getBounds().pad(0.3), {maxZoom: 7});
  } catch (e) { /* hartă indisponibilă */ }
}

function scoreTable(rows, kind) {
  if (!rows || !rows.length) return `<div class="empty">${t(kind === 'daily' ? 'noDaily' : 'noContest')}</div>`;
  return `<div class="scroll"><table><thead><tr><th>#</th><th>${t('pilot')}</th><th class="num">${t('score')}</th><th class="num">${t('landing')}</th><th class="num hide-m">G</th><th class="hide-m">${kind === 'daily' ? t('aircraft') : t('route')}</th>${kind === 'daily' ? `<th class="num hide-m">${t('attempts')}</th>` : `<th class="num hide-m">${t('when')}</th>`}</tr></thead><tbody>` +
    rows.map((x) => `<tr class="p${x.pos}"><td class="pos">${['🥇','🥈','🥉'][x.pos-1] || x.pos}</td><td><a href="#/pilot/${x.pilot_id}"><b>${esc(x.callsign)}</b></a></td><td class="num"><b>${x.score}</b></td><td class="num">${fmt(x.vs)} fpm</td><td class="num hide-m">${x.g != null ? fmt(x.g, 2) : '—'}</td><td class="hide-m muted">${esc(kind === 'daily' ? (x.aircraft || '') : (x.arr || ''))}</td>${kind === 'daily' ? `<td class="num hide-m">${fmt(x.attempts)}</td>` : `<td class="num hide-m muted">${ago(x.created_at)}</td>`}</tr>`).join('') + '</tbody></table></div>';
}
function dailyHead(d) {
  const left = Math.max(0, Math.round((Date.parse(d.day + 'T00:00:00Z') + 86400000 - Date.now()) / 3600000));
  return `<div style="padding:14px 16px;border-bottom:1px solid var(--line)"><b style="font-size:20px">${esc(d.icao)}</b> · ${lang==='ro'?'pista':'runway'} <b>${esc(d.rwy)}</b>${d.light_only ? ` · <span class="muted">${lang==='ro'?'pistă scurtă – avion ușor':'short strip – light aircraft'}</span>` : ''}<br><span class="muted">${fmt(d.players)} ${t('players')} · ${lang==='ro'?'se termină în':'ends in'} ~${left} h · ${t('tomorrow')}: ${esc(d.tomorrow && d.tomorrow.icao || '?')}</span></div>`;
}
async function daily() {

function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((res, rej) => {
    const c = document.createElement('link'); c.rel = 'stylesheet'; c.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(c);
    const s = document.createElement('script'); s.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('on', a.dataset.r === (parts[0] === 'pilot' ? 'leaderboard' : parts[0])));
  window.scrollTo(0, 0);
  if (parts[0] === 'leaderboard') return leaderboard(parts[1]);
  if (parts[0] === 'flights') return flights();
  if (parts[0] === 'daily') return daily();
  if (parts[0] === 'contest') return contest(parts[1]);
  if (parts[0] === 'airlines') return airlines();
  if (parts[0] === 'install') return install();
  if (parts[0] === 'pilot' && parts[1]) return pilot(parts[1]);
  return home();
}
